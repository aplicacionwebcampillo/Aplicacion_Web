name: DIAG acta partido RFAF v2

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          pip install playwright
          playwright install firefox
      - run: python backend/app/web_scrappig/_diag_acta2.py
