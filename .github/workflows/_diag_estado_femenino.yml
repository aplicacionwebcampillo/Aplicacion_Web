name: _diag_estado_femenino

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests playwright beautifulsoup4
      - run: playwright install firefox
      - run: python _diag_estado_femenino.py
      - run: python _diag_club_rfaf.py
