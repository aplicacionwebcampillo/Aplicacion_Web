name: Recordatorio actualizar lapreferente

on:
  workflow_dispatch:

  schedule:
    # Lunes a las 09:00 UTC. lapreferente no se puede sincronizar en modo
    # automático (protegido por Cloudflare, ver docstring de
    # lapreferente_estadisticas_sync.py), así que este workflow no intenta
    # ejecutarlo -- solo envía el aviso semanal para hacerlo a mano.
    - cron: '0 9 * * 1'

jobs:
  recordatorio:
    runs-on: ubuntu-latest
    steps:
      - name: Enviar recordatorio por email
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_SMTP_USER }}
          password: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          subject: "🔔 Campillo CF: toca actualizar lapreferente"
          to: aplicacionwebcampillo@gmail.com
          from: Sincronizador Campillo CF
          body: |
            Recordatorio semanal: ejecuta en tu ordenador para actualizar posición, estado de
            fichaje/renovación y estadísticas de la temporada (partidos, titularidades, goles,
            tarjetas) de toda la plantilla:

              bash backend/app/web_scrappig/actualizar_lapreferente.sh
