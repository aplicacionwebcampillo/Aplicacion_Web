name: Diagnostico lapreferente temporal

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar dependencias
        run: |
          pip install playwright beautifulsoup4
          playwright install firefox
      - name: Inspeccionar pagina con navegador real
        run: |
          python3 << 'PY'
          from playwright.sync_api import sync_playwright
          from bs4 import BeautifulSoup

          url = "https://www.lapreferente.com/E38004/cd-campillo-del-rio-cf"

          with sync_playwright() as p:
              browser = p.firefox.launch(headless=True)
              page = browser.new_page()
              page.goto(url, wait_until="networkidle", timeout=60000)
              page.wait_for_timeout(5000)
              title = page.title()
              html = page.content()
              browser.close()

          print("TITLE:", title)
          print("LEN:", len(html))

          soup = BeautifulSoup(html, "html.parser")
          tablas = soup.select("table")
          print(f"Nº de <table>: {len(tablas)}")
          for i, t in enumerate(tablas):
              filas = t.select("tr")
              print(f"--- tabla {i}: {len(filas)} filas, class={t.get('class')} id={t.get('id')} ---")

          for i, t in enumerate(tablas[:6]):
              print(f"\n===== FRAGMENTO TABLA {i} =====")
              print(str(t)[:3000])

          if not tablas:
              print("\n===== FRAGMENTO BODY (sin tablas) =====")
              body = soup.find("body")
              print(str(body)[:3000] if body else html[:3000])
          PY
