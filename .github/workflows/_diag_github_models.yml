name: DIAG GitHub Models vision

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests
      - env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python backend/app/web_scrappig/_diag_github_models.py
