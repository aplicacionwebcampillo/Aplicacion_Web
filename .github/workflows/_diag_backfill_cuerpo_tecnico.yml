name: _diag_backfill_cuerpo_tecnico

on:
  workflow_dispatch:

jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright requests google-genai pydantic
          playwright install firefox

      - name: Restaurar sesión de Instagram guardada
        run: |
          echo "${{ secrets.IG_STORAGE_STATE_B64 }}" | base64 -d > "$RUNNER_TEMP/ig_storage_state.json"

      - name: Ejecutar prueba
        env:
          IG_TARGET_USERNAME: ${{ secrets.IG_TARGET_USERNAME }}
          IG_STORAGE_STATE_FILE: ${{ runner.temp }}/ig_storage_state.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python backend/app/web_scrappig/_diag_backfill_cuerpo_tecnico.py
