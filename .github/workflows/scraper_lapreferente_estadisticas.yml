name: Actualizar plantilla desde lapreferente.com

on:
  workflow_dispatch:

  schedule:
    # Lunes a las 10:00 UTC, una hora después del actualizador de la RFAF
    # (para no competir por el mismo runner ni pisarse en el log). Solo
    # tiene éxito si el secret LAPREFERENTE_STORAGE_STATE_B64 sigue siendo
    # una sesión fresca (la cookie de Cloudflare dura horas, no días): si ha
    # caducado, el paso de sincronización lo detecta y termina limpio sin
    # tocar la BD, avisando de que hay que regenerarla.
    - cron: '0 10 * * 1'

jobs:
  lapreferente:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright requests beautifulsoup4
          playwright install firefox

      - name: Restaurar sesión de lapreferente guardada
        run: |
          echo "${{ secrets.LAPREFERENTE_STORAGE_STATE_B64 }}" | base64 -d > "$RUNNER_TEMP/lapreferente_storage_state.json"
          echo "Bytes decodificados: $(wc -c < "$RUNNER_TEMP/lapreferente_storage_state.json")"
          python3 -c "
          import json, sys
          try:
              with open('$RUNNER_TEMP/lapreferente_storage_state.json', encoding='utf-8') as f:
                  data = json.load(f)
              print(f\"[OK] JSON de sesión válido ({len(data.get('cookies', []))} cookies)\")
          except json.JSONDecodeError as e:
              print(f'::error::El fichero de sesión decodificado no es un JSON válido ({e}). El secret LAPREFERENTE_STORAGE_STATE_B64 llegó incompleto/corrupto: regenera la sesión y vuelve a subirlo.')
              sys.exit(1)
          "

      - name: Ejecutar sincronizador de lapreferente
        env:
          PYTHONUNBUFFERED: "1"
        run: python backend/app/web_scrappig/lapreferente_estadisticas_sync.py "$RUNNER_TEMP/lapreferente_storage_state.json"
