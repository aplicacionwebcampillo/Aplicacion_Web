name: Sincronizar plantilla desde Instagram

on:
  workflow_dispatch:

  schedule:
    # Cada 3 días a las 09:00 UTC (una hora después del importador de
    # noticias, para no competir por la misma sesión de Instagram a la vez).
    - cron: '0 9 */3 * *'

permissions:
  contents: write

jobs:
  jugadores:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright requests google-genai pydantic
          playwright install firefox

      - name: Restaurar sesión de Instagram guardada
        run: |
          echo "${{ secrets.IG_STORAGE_STATE_B64 }}" | base64 -d > "$RUNNER_TEMP/ig_storage_state.json"
          echo "Bytes decodificados: $(wc -c < "$RUNNER_TEMP/ig_storage_state.json")"
          python3 -c "
          import json, sys
          try:
              with open('$RUNNER_TEMP/ig_storage_state.json', encoding='utf-8') as f:
                  data = json.load(f)
              print(f\"[OK] JSON de sesión válido ({len(data.get('cookies', []))} cookies)\")
          except json.JSONDecodeError as e:
              print(f'::error::El fichero de sesión decodificado no es un JSON válido ({e}). El secret IG_STORAGE_STATE_B64 llegó incompleto/corrupto: regenera la sesión y vuelve a subirlo.')
              sys.exit(1)
          "

      - name: Ejecutar sincronizador de plantilla
        env:
          IG_TARGET_USERNAME: ${{ secrets.IG_TARGET_USERNAME }}
          IG_STORAGE_STATE_FILE: ${{ runner.temp }}/ig_storage_state.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: python backend/app/web_scrappig/instagram_jugadores_sync.py

      - name: Guardar progreso de la sincronización
        # Se ejecuta también si el paso anterior falla a medio camino (p.ej.
        # límite de cuota), para no perder el progreso ya conseguido.
        if: always()
        run: |
          if [ -f data/instagram_jugadores_procesados.json ]; then
            git add data/instagram_jugadores_procesados.json
            if git diff --cached --quiet; then
              echo "Sin cambios en el progreso, nada que subir."
            else
              git config user.name "github-actions[bot]"
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git commit -m "Actualizar progreso del sincronizador de plantilla [skip ci]"
              git push
            fi
          else
            echo "No se generó fichero de progreso en esta ejecución."
          fi

      - name: Avisar por email si algo falló
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_SMTP_USER }}
          password: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          subject: "⚠️ Campillo CF: hay que actualizar la sesión de Instagram"
          to: aplicacionwebcampillo@gmail.com
          from: Sincronizador Campillo CF
          body: |
            La sincronización de Instagram ha fallado. Lo más probable es que la sesión guardada
            haya caducado o Instagram la haya bloqueado.

            Para arreglarlo, ejecuta en tu ordenador:

              bash backend/app/web_scrappig/actualizar_secret_instagram.sh

            Log de la ejecución que falló:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
