name: Run Playwright Scraper

on:
  workflow_dispatch:  # Ejecutar manualmente
  schedule:
    - cron: '0 0 * * *'  # Ejecutar todos los días a medianoche (opcional)

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install

      - name: Run scraper
        run: |
          python scraper.py

      - name: Upload results
        uses: actions/upload-artifact@v3
        with:
          name: scraper-results
          path: results.json  # Cambia según tu archivo de resultados
