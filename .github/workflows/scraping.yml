# Nombre del workflow
name: Actualizar BD con Web Scraping (Playwright)

# Disparadores del workflow
on:
  # Permite la ejecución manual
  workflow_dispatch:

  # Ejecuta el workflow todos los días a las 02:00 AM UTC
  schedule:
    - cron: '0 * * * *'

# Definición de los trabajos
jobs:
  scrape-and-update:
    # Usar la última versión de Ubuntu
    runs-on: ubuntu-latest
    # Aumentar el tiempo de espera si el scraping es largo (ej. 15 minutos)
    timeout-minutes: 15

    steps:
      # 1. Clonar el repositorio
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      # 2. Configurar Python
      - name: Configurar Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          # Cache para las dependencias de pip, acelera ejecuciones futuras
          cache: 'pip'

      # 3. Instalar dependencias de Python (asegúrate de que Playwright esté en requirements.txt)
      - name: Instalar dependencias de Python
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Asegúrate de que playwright esté listado en backend/requirements.txt
          # o añádelo explícitamente aquí si no lo está:
          # pip install playwright

      # 4. Instalar los navegadores de Playwright
      # Este comando instalará los navegadores y sus dependencias de sistema.
      - name: Instalar navegadores de Playwright (Firefox)
        run: playwright install firefox

      # 5. Ejecutar el script de web scraping
      - name: Ejecutar script de scraping
        # Pasa el secreto de la base de datos como una variable de entorno.
        # Tu script Python ya usa `os.environ.get` o similar para leerlo.
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python backend/app/web_scrappig/main.py
