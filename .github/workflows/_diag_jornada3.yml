name: _diag_jornada3

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install beautifulsoup4 playwright
      - run: playwright install firefox
      - run: python _diag_jornada3.py
