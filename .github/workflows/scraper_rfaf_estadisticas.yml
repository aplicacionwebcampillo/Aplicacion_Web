name: Actualizar estadísticas de jugadores desde la RFAF

on:
  workflow_dispatch:

  schedule:
    # Lunes a las 09:00 UTC, tras el fin de semana de partidos.
    - cron: '0 9 * * 1'

jobs:
  estadisticas:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar actualizador de estadísticas
        env:
          PYTHONUNBUFFERED: "1"
        run: python backend/app/web_scrappig/scraper_rfaf_estadisticas.py
