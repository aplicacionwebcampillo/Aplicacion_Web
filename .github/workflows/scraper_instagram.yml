name: Importar noticias desde Instagram

on:
  workflow_dispatch:

  schedule:
    # Cada 3 días a las 08:00 UTC. Frecuencia baja a propósito: es scraping
    # no oficial y una cadencia diaria aumenta el riesgo de bloqueo por
    # parte de Instagram. Ajustar aquí si hace falta más o menos frecuencia.
    - cron: '0 8 */3 * *'

jobs:
  instagram:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Instalar dependencias
        run: |
          pip install playwright requests
          playwright install firefox

      - name: Restaurar sesión de Instagram guardada
        run: |
          echo "${{ secrets.IG_STORAGE_STATE_B64 }}" | base64 -d > "$RUNNER_TEMP/ig_storage_state.json"

      - name: Ejecutar importador de Instagram
        env:
          IG_TARGET_USERNAME: ${{ secrets.IG_TARGET_USERNAME }}
          IG_STORAGE_STATE_FILE: ${{ runner.temp }}/ig_storage_state.json
          NOTICIA_ADMIN_DNI: ${{ secrets.NOTICIA_ADMIN_DNI }}
          PYTHONUNBUFFERED: "1"
        run: python backend/app/web_scrappig/scraper_instagram.py

      - name: Avisar por email si algo falló
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.EMAIL_SMTP_USER }}
          password: ${{ secrets.EMAIL_SMTP_PASSWORD }}
          subject: "🔔 C.D. CAMPILLO DEL RÍO C.F. Actualizar Sesión Instagram"
          to: aplicacionwebcampillo@gmail.com
          from: Importador de noticias Campillo CF
          body: |
            La importación de noticias desde Instagram ha fallado. Lo más probable es que la sesión guardada
            haya caducado o Instagram la haya bloqueado.

            Para arreglarlo, ejecuta en tu ordenador:

              bash backend/app/web_scrappig/actualizar_secret_instagram.sh

            Log de la ejecución que falló:
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
