name: _diag inspeccionar acta

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: |
          pip install playwright beautifulsoup4
          playwright install firefox
      - run: python backend/app/web_scrappig/_diag_inspeccionar_acta.py
