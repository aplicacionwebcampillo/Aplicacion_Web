name: _diag categoria links

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install playwright beautifulsoup4 fastapi sqlalchemy httpx aiohttp weasyprint python-dotenv
      - run: playwright install firefox
      - env:
          PYTHONPATH: ./backend
        run: python backend/app/web_scrappig/_diag_categoria_links.py
