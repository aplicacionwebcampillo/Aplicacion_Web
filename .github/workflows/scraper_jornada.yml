name: Actualizar resultados RFAF

on:
  schedule:
  # Lunes a viernes a las 00:00
  - cron: '0 0 * * 1-5'

  # Sábados y domingos cada 2 horas (00:00, 02:00, 04:00, ...)
  - cron: '0 */2 * * 6,0'
  
  workflow_dispatch:        # También puedes lanzarlo manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Asegúrate de que playwright esté listado en backend/requirements.txt
          # o añádelo explícitamente aquí si no lo está:
          # pip install playwright

      - name: Instalar Playwright
        run: playwright install firefox

      - name: Ejecutar scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          export PYTHONPATH=$PYTHONPATH:./backend
          python backend/app/web_scrappig/scraper_jornada.py
