name: Actualizar resultados RFAF

on:
  schedule:
    - cron: '0 * * * *'  # Cada 6 horas
  workflow_dispatch:        # También puedes lanzarlo manualmente

jobs:
  scrape:
    runs-on: ubuntu-latest

    timeout-minutes: 15

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Asegúrate de que playwright esté listado en backend/requirements.txt
          # o añádelo explícitamente aquí si no lo está:
          # pip install playwright

      - name: Instalar Playwright
        run: playwright install firefox

      - name: Ejecutar scraper
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python backend/app/web_scrappig/scraper_jornada.py
